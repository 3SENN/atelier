version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node follows the Node inside Electron (Node 24 for Electron 45), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # three.js is the version the Atelier kit promises to apps (docs/apps.md › The kit); it moves with the kit, on purpose.
      - dependency-name: 'three'
      - dependency-name: '@types/three'
    groups:
      # pdf.js on its own: a new version can change how fast PDFs read (6.5 was slower on the CI runners, #9 and #10),
      # so it gets its own pull request instead of holding back the others.
      pdfjs:
        patterns: ['pdfjs-dist']
      minor-and-patch:
        update-types: [minor, patch]
